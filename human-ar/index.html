<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Human AR — Camera Test</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="app">

    <header class="top-bar">
      <a class="back-link" href="../">← Back</a>

      <span class="milestone">
        Human AR — M2
      </span>
    </header>

    <section class="camera-container">

      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

      <div id="camera-placeholder" class="camera-placeholder">
        Camera not started
      </div>

    </section>

    <section class="controls">

      <button id="start-camera" type="button">
        Start Camera
      </button>

      <button id="switch-camera" type="button" disabled>
        Switch Camera
      </button>

      <button id="stop-camera" type="button" disabled>
        Stop Camera
      </button>

    </section>

    <section class="debug-panel">

      <h2>Debug Status</h2>

      <div class="debug-row">
        <strong>Status</strong>
        <span id="status">Ready</span>
      </div>

      <div class="debug-row">
        <strong>Protocol</strong>
        <span id="protocol-status">Checking...</span>
      </div>

      <div class="debug-row">
        <strong>Secure Context</strong>
        <span id="secure-status">Checking...</span>
      </div>

      <div class="debug-row">
        <strong>getUserMedia</strong>
        <span id="media-status">Checking...</span>
      </div>

      <div class="debug-row">
        <strong>Camera</strong>
        <span id="camera-status">Stopped</span>
      </div>

      <div class="debug-row">
        <strong>Facing Mode</strong>
        <span id="facing-status">user</span>
      </div>

      <div class="debug-row">
        <strong>Resolution</strong>
        <span id="resolution-status">—</span>
      </div>

      <div class="debug-row">
        <strong>Error</strong>
        <span id="error-status">None</span>
      </div>

    </section>

  </main>

  <script type="module" src="./app.js"></script>

</body>
</html>
