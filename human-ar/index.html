<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Human AR — Three.js Test</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="app">

    <header class="top-bar">
      <a class="back-link" href="../">← Back</a>
      <span class="milestone">Human AR — M4</span>
    </header>

    <section class="camera-container">

      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

      <!-- Three.js renders here -->
      <div id="three-layer"></div>

      <!-- MediaPipe debug overlay -->
      <canvas id="pose-overlay"></canvas>

      <div
        id="camera-placeholder"
        class="camera-placeholder"
      >
        Camera not started
      </div>

    </section>

    <section class="controls">

      <button id="start-camera" type="button">
        Start Camera
      </button>

      <button id="switch-camera" type="button" disabled>
        Switch Camera
      </button>

      <button id="stop-camera" type="button" disabled>
        Stop Camera
      </button>

    </section>

    <section class="debug-panel">

      <h2>Debug Status</h2>

      <div class="debug-row">
        <strong>Status</strong>
        <span id="status">Loading...</span>
      </div>

      <div class="debug-row">
        <strong>Camera</strong>
        <span id="camera-status">Stopped</span>
      </div>

      <div class="debug-row">
        <strong>Facing Mode</strong>
        <span id="facing-status">user</span>
      </div>

      <div class="debug-row">
        <strong>Resolution</strong>
        <span id="resolution-status">—</span>
      </div>

      <div class="debug-row">
        <strong>MediaPipe</strong>
        <span id="mediapipe-status">Loading...</span>
      </div>

      <div class="debug-row">
        <strong>Person</strong>
        <span id="person-status">Not detected</span>
      </div>

      <div class="debug-row">
        <strong>Pose FPS</strong>
        <span id="fps-status">—</span>
      </div>

      <div class="debug-row">
        <strong>Three.js</strong>
        <span id="three-status">Loading...</span>
      </div>

      <div class="debug-row">
        <strong>3D Anchor</strong>
        <span id="anchor-status">Hidden</span>
      </div>

      <div class="debug-row">
        <strong>Left Shoulder</strong>
        <span id="left-shoulder-status">—</span>
      </div>

      <div class="debug-row">
        <strong>Right Shoulder</strong>
        <span id="right-shoulder-status">—</span>
      </div>

      <div class="debug-row">
        <strong>Error</strong>
        <span id="error-status">None</span>
      </div>

    </section>

  </main>

  <script type="module" src="./app.js"></script>

</body>
</html>
